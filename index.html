<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="calculator.css">
    <title>Calculator</title>
</head>
<body>

    <div class="Calculator">
        
        <input type="text" id="display" placeholder="0">
    
     <div class="buttons-wrapper"> 

<div class="buttons scientific">
    <button onclick="appendValue('(')">(</button>
    <button onclick="appendValue(')')">)</button>
    <button onclick="memoryClear()">mc</button>
    <button onclick="memoryAdd()">m+</button>

    <button onclick="memorySubtract()">m-</button>
    <button onclick="memoryRecall()">mr</button>
    <button onclick="square()">x²</button>
    <button onclick="cube()">x³</button>

    <button onclick="power()">xʸ</button>
    <button onclick="exp()">eˣ</button>
    <button onclick="tenPower()">10ˣ</button>
    <button onclick="ln()">ln</button>

    <button onclick="sin()">sin</button>
    <button onclick="cos()">cos</button>
    <button onclick="tan()">tan</button>
  
    <button onclick="cuberoot()">∛x</button>
    <button onclick="reciprocal()">x⁻¹</button>
    <button onclick="twoPower()">2ˣ</button>
    
    <button onclick="sinh()">sinh</button>
    <button onclick="cosh()">cosh</button>
    <button onclick="tanh()">tanh</button>
    
    <button onclick="ceil()">ceil</button>
    <button onclick="floor()">floor</button>
    <button onclick="random()">rand</button>
    <button onclick="sign()">sgn</button>
</div>

        <div class="basic">

       <button onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button onclick="appendValue('%')">%</button>
            <button class="operation" onclick="appendValue('*')">*</button>
        <button onclick="appendValue('7')">7</button>
         <button onclick="appendValue('8')">8</button>
         <button onclick="appendValue('9')">9</button>
            <button class="operation"  onclick="appendValue('/')">÷</button>
         <button onclick="appendValue('4')">4</button>
         <button onclick="appendValue('5')">5</button>
         <button onclick="appendValue('6')">6</button>
            <button class="operation" onclick="appendValue('-')">-</button>
        <button onclick="appendValue('1')">1</button>
         <button onclick="appendValue('2')">2</button>
         <button onclick="appendValue('3')">3</button>
            <button class="operation"onclick="appendValue('+')">+</button>
        <div class="dropdown">
        <button id="calcbutton"><select id="mode" onchange="switchMode(this.value)">
            <option value="basic">Basic</option>
            <option value="scientific">Scientific</option>
       </select>
     </button>
            </div>
         <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="operation" onclick="calculateresult('')">=</button></div>
        <script src="script.js"></script>
    </div>
   </div>
</body>

</html>
